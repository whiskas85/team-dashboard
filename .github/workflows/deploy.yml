name: CI & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: python3 -m py_compile agent/zdt-agent.py
      - run: bash -n deploy/setup.sh && bash -n agent/install.sh

  # Deploys to the host behind console.zerodarkteam.it over SSH.
  # Required repository secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (and optionally DEPLOY_PATH).
  # deploy/setup.sh is idempotent: installs Docker if needed, keeps an existing deploy/.env.
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - name: Skip when deploy secrets are missing
        if: env.DEPLOY_HOST == ''
        run: echo "::notice::DEPLOY_HOST non configurato, deploy saltato"
      - uses: actions/checkout@v4
        if: env.DEPLOY_HOST != ''
      - name: Sync & restart
        if: env.DEPLOY_HOST != ''
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/zerodark-console' }}
        run: |
          mkdir -p ~/.ssh
          # Keys pasted from a Windows terminal often carry CR characters or trailing spaces: strip them.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed -e 's/[[:space:]]*$//' -e '/^$/d' > ~/.ssh/id && chmod 600 ~/.ssh/id
          if ! ssh-keygen -y -f ~/.ssh/id > /dev/null; then
            echo "::error::DEPLOY_SSH_KEY non è una chiave privata valida. Ricopiala intera (da -----BEGIN a -----END, righe comprese) da: cat /root/.ssh/github_deploy"
            exit 1
          fi
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf '{"commit":"%s","built_at":"%s","run":"%s","repo":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_RUN_NUMBER" "$GITHUB_REPOSITORY" > server/build.json
          SSH="ssh -i $HOME/.ssh/id -o BatchMode=yes"
          rsync -az --delete --exclude .git --exclude deploy/.env --exclude data/ -e "$SSH" ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" "cd $DEPLOY_PATH/deploy && bash setup.sh && docker image prune -f"
      - name: Health check
        if: env.DEPLOY_HOST != ''
        run: |
          for i in $(seq 1 20); do
            curl -fsS https://console.zerodarkteam.it/healthz && exit 0
            sleep 5
          done
          echo "::error::console.zerodarkteam.it non risponde dopo il deploy"; exit 1
